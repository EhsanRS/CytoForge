[project]
name = "cytoforge"
version = "0.1.0"
description = "Local-first, high-performance cytometry analysis workbench"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "numpy>=2.2",
  "scipy>=1.15",
  "flowio>=1.4",
  "flowutils>=1.2",
  "python-multipart>=0.0.20",
  "pydantic>=2.10",
  "scikit-learn>=1.6",
  "defusedxml>=0.7",
  "umap-learn>=0.5.12",
  "flowsom>=0.2.2",
  "threadpoolctl>=3.7.0",
  "lxml>=6.0",
  "xlsxwriter>=3.2.9",
  "matplotlib>=3.11.2",
  "contourpy>=1.4.0",
  "igraph==1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.11",
    "pyinstaller>=6.12",
    "flowkit>=1.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/cytoforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]
cache_dir = ".cache/pytest"
addopts = "--basetemp=.tmp/pytest"

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
